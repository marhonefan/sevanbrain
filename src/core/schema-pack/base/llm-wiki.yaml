# llm-wiki — LLM Wiki (layered-ACL knowledge wiki) structure declarations.
#
# llwiki-sevanbrain-upgrade T070 (PRD §7.3): declares kb/ page types and the
# frontmatter relation-field → typed-edge map for LLM Wiki sources (kb-only
# import via `sync --include "kb/**"`). Governance config authority stays in
# each wiki's _meta/ — this pack declares structure only, no per-wiki config.
#
# extends gbrain-base: inherits universal behavior (incl. related_to link
# type); this pack adds kb path typing + the wiki relation vocabulary.
# extractable/expert_routing stay false: enrichment & expert routing are
# disabled for wiki sources (PRD §一 主体性纪律 4 — no autonomous rewriting).

api_version: gbrain-schema-pack-v1
name: llm-wiki
version: 1.1.0
description: LLM Wiki kb page types + frontmatter typed-link declarations (kb-only layered-ACL wiki)
#
# v1.1.0 (SR 知识库本体论&DDD重构0709): +kb-aggregate/kb-process page_types (DDD Hub/Spoke,
#   three-tier paths kb/<domain>/<subdomain>/<bc>/{aggregates,processes}/) + ontology edge
#   link_types (calls_to_create/calls_to_modify/reads/contains).
#   NOTE (OQ-01 conclusion B): depends_on ({node, relation}) and contains ({name, kind}) are
#   STRUCTURED frontmatter fields, not plain wikilink lists — the current schema-pack DSL cannot
#   declare edges from them. They are materialized by sevan-wiki gbrain_sync.sh chunk-preprocess
#   (cross-BC pages) before sync; doc-level chunking (H2 split + [bc:x] extraction) is likewise a
#   sync-preprocess concern, NOT a schema-pack key (an unknown top-level key would fail the pack's
#   zod validation and break all wiki sync). extractable/expert_routing stay false.
gbrain_min_version: 0.42.0
extends: gbrain-base
borrow_from: []

page_types:
  # Stronger-signal types first (override the kb/ fallback below).
  - name: kb-entity
    primitive: entity
    path_prefixes:
      - "kb/*/entities/"
    aliases: []
    extractable: false
    expert_routing: false
  - name: kb-solution
    primitive: concept
    path_prefixes:
      - "kb/*/solutions/"
    aliases: []
    extractable: false
    expert_routing: false
  - name: kb-playbook
    primitive: concept
    path_prefixes:
      - "kb/*/playbooks/"
    aliases: []
    extractable: false
    expert_routing: false
  - name: kb-decision
    primitive: concept
    path_prefixes:
      - "kb/*/decisions/"
    aliases: []
    extractable: false
    expert_routing: false
  - name: kb-aggregate          # v1.1.0 DDD 聚合根 Hub（三层路径）
    primitive: concept
    path_prefixes:
      - "kb/**/aggregates/"
      - "kb/*/*/*/aggregates/"
      - "kb/*/aggregates/"
    aliases: []
    extractable: false
    expert_routing: false
  - name: kb-process            # v1.1.0 DDD 流程编排 Spoke（三层路径）
    primitive: concept
    path_prefixes:
      - "kb/**/processes/"
      - "kb/*/*/*/processes/"
      - "kb/*/processes/"
    aliases: []
    extractable: false
    expert_routing: false
  - name: kb-concept            # fallback for all other kb/ pages
    primitive: concept
    path_prefixes:
      - "kb/"
    aliases: []
    extractable: false
    expert_routing: false

# related_to is inherited from gbrain-base; only the wiki-specific relation
# verbs are declared here. No body-verb inference — these edges come from
# frontmatter fields (see frontmatter_links below).
link_types:
  - name: supersedes
    inverse: superseded_by
  - name: superseded_by
    inverse: supersedes
  - name: prerequisite
  - name: merged_from
  # v1.1.0 ontology 边词汇（gbrain_sync 预处理物化时使用；见文件头 OQ-01 conclusion B）
  - name: calls_to_create
  - name: calls_to_modify
  - name: reads
  - name: contains

# Expanded per page_type: the manifest schema requires page_type on every
# rule (frontmatterLinkTypeFromPack supports untyped matching, but the zod
# schema does not yet — upstream PR-B candidate). 5 kb types x 5 rules.
frontmatter_links:
  - page_type: entity
    fields: [related_concepts, related_playbooks, related_decisions, related_events, related_entities]
    link_type: related_to
  - page_type: entity
    fields: [supersedes]
    link_type: supersedes
  - page_type: entity
    fields: [superseded_by]
    link_type: superseded_by
  - page_type: entity
    fields: [prerequisites]
    link_type: prerequisite
  - page_type: entity
    fields: [merged_from]
    link_type: merged_from
  - page_type: solution
    fields: [related_concepts, related_playbooks, related_decisions, related_events, related_entities]
    link_type: related_to
  - page_type: solution
    fields: [supersedes]
    link_type: supersedes
  - page_type: solution
    fields: [superseded_by]
    link_type: superseded_by
  - page_type: solution
    fields: [prerequisites]
    link_type: prerequisite
  - page_type: solution
    fields: [merged_from]
    link_type: merged_from
  - page_type: playbook
    fields: [related_concepts, related_playbooks, related_decisions, related_events, related_entities]
    link_type: related_to
  - page_type: playbook
    fields: [supersedes]
    link_type: supersedes
  - page_type: playbook
    fields: [superseded_by]
    link_type: superseded_by
  - page_type: playbook
    fields: [prerequisites]
    link_type: prerequisite
  - page_type: playbook
    fields: [merged_from]
    link_type: merged_from
  - page_type: decision
    fields: [related_concepts, related_playbooks, related_decisions, related_events, related_entities]
    link_type: related_to
  - page_type: decision
    fields: [supersedes]
    link_type: supersedes
  - page_type: decision
    fields: [superseded_by]
    link_type: superseded_by
  - page_type: decision
    fields: [prerequisites]
    link_type: prerequisite
  - page_type: decision
    fields: [merged_from]
    link_type: merged_from
  - page_type: concept
    fields: [related_concepts, related_playbooks, related_decisions, related_events, related_entities]
    link_type: related_to
  - page_type: concept
    fields: [supersedes]
    link_type: supersedes
  - page_type: concept
    fields: [superseded_by]
    link_type: superseded_by
  - page_type: concept
    fields: [prerequisites]
    link_type: prerequisite
  - page_type: concept
    fields: [merged_from]
    link_type: merged_from
